name: Release

# On a v* tag: shellcheck, package steel-panda.tar.gz + install.sh + SHA256SUMS.txt, create the GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Shellcheck
        run: shellcheck -S error steel.sh install.sh Tasks/*.sh
      - name: Package
        run: |
          mkdir -p dist
          tar czf dist/steel-panda.tar.gz steel.sh Tasks Documents Assets README.md LICENSE CHANGELOG.md
          cp install.sh dist/
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag --latest
