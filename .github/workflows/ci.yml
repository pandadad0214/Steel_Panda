name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: shellcheck -S error steel.sh install.sh Tasks/*.sh
      - name: Install script smoke test (local tarball)
        run: |
          git ls-files -z -- . ':!.github' | tar czf /tmp/pkg.tar.gz --null -T -
          PANDA_TARBALL=/tmp/pkg.tar.gz INSTALL_DIR=/tmp/inst NO_RUN=1 bash install.sh
          ls -la /tmp/inst
          cd /tmp/inst && bash steel.sh && cat steel.log
